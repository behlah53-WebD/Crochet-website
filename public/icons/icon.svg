<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Terracotta Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77B58" />
      <stop offset="50%" stop-color="#B85C38" />
      <stop offset="100%" stop-color="#8F3E20" />
    </linearGradient>

    <!-- Warm Studio Inner Glow -->
    <radialGradient id="studioGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Bead Gradient -->
    <radialGradient id="beadGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF5EE" />
      <stop offset="40%" stop-color="#E5DAC6" />
      <stop offset="100%" stop-color="#B85C38" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B2320" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#terracottaGrad)" />
  <rect width="512" height="512" rx="128" fill="url(#studioGlow)" />

  <!-- Running Stitched Thread Border -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#FAF6F0" stroke-width="4" stroke-dasharray="14 10" stroke-opacity="0.55" />

  <!-- Artisanal Crochet Monogram Letter "L" -->
  <g filter="url(#monogramShadow)">
    <text x="256" y="330" font-family="'Playfair Display', 'Fraunces', Georgia, serif" font-size="280" font-weight="bold" fill="#FAF6F0" text-anchor="middle" letter-spacing="-4">
      L
    </text>
  </g>

  <!-- Small Heart Stitch Accent -->
  <path d="M 330 190 C 330 176 342 166 354 166 C 362 166 368 170 372 176 C 376 170 382 166 390 166 C 402 166 414 176 414 190 C 414 208 388 226 372 238 C 356 226 330 208 330 190 Z" fill="#DEB49F" opacity="0.9" />

  <!-- Pearl Thread Knot Bead -->
  <circle cx="372" cy="340" r="14" fill="url(#beadGrad)" stroke="#FAF6F0" stroke-width="2" />
</svg>
